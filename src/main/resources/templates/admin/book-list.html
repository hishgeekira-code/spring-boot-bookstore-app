<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Books')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container flex-grow-1 py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Manage Books</h1>
        <a th:href="@{/admin/books/new}" class="btn btn-dark">Add book</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">ISBN</th>
                    <th scope="col">Category</th>
                    <th scope="col">Price</th>
                    <th scope="col">Stock</th>
                    <th scope="col" class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}">1</td>
                    <td><a th:href="@{/books/{id}(id=${book.id})}" class="text-decoration-none" th:text="${book.title}">Title</a></td>
                    <td th:text="${book.author}">Author</td>
                    <td class="text-muted small" th:text="${book.isbn}">ISBN</td>
                    <td th:text="${book.category}">Category</td>
                    <td>$<span th:text="${#numbers.formatDecimal(book.price, 1, 2)}">0.00</span></td>
                    <td th:text="${book.stock}">0</td>
                    <td class="text-end">
                        <a th:href="@{/admin/books/{id}/edit(id=${book.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <form th:action="@{/admin/books/{id}/delete(id=${book.id})}" method="post" class="d-inline confirm-delete">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center py-5" th:if="${books.isEmpty()}">
        <p class="text-muted">No books yet. Add your first book.</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
