<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Checkout')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container flex-grow-1 py-4" style="max-width: 960px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-4">Checkout</h1>

    <div class="row g-4">
        <div class="col-md-7">
            <form th:action="@{/orders/checkout}" th:object="${checkoutForm}" method="post" novalidate class="needs-validation">
                <div class="mb-3">
                    <label class="form-label" for="name">Full name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}">Name error</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}">Email error</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="address">Shipping address</label>
                    <textarea id="address" th:field="*{address}" rows="3" class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{address}">Address error</div>
                </div>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}">Stock error</div>
                <button type="submit" class="btn btn-dark w-100">Place order</button>
            </form>
        </div>

        <div class="col-md-5">
            <div class="card">
                <div class="card-header fw-semibold">Order summary</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between" th:each="line : ${lines}">
                        <span th:text="|${line.quantity} \u00D7 ${line.book.title}|">1 x Title</span>
                        <span>$<span th:text="${#numbers.formatDecimal(line.subtotal, 1, 2)}">0.00</span></span>
                    </li>
                </ul>
                <div class="card-body d-flex justify-content-between">
                    <span class="fw-bold">Total</span>
                    <span class="fw-bold text-success">$<span th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span></span>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
