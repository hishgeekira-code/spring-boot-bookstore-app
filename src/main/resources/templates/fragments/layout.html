<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Bookstore'">Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="nav">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">Bookstore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <form class="d-flex mx-auto my-2 my-lg-0" th:action="@{/}" method="get" role="search">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search by title or author" th:value="${q}">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cart}">
                            Cart
                            <span class="badge rounded-pill bg-primary" th:text="${session.cartCount ?: 0}">0</span>
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/orders}">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer" class="footer mt-auto py-3 bg-light border-top">
    <div class="container text-center text-muted small">
        &copy; 2026 Bookstore &middot; Built with Spring Boot & Thymeleaf
    </div>
</footer>

<div th:fragment="flash">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${flash}" th:text="${flash}">
        flash
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}" th:text="${error}">
        error
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
</body>
</html>
