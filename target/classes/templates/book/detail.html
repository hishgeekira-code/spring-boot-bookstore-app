<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book details')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container flex-grow-1 py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item" th:if="${book.category}" th:text="${book.category}">Category</li>
            <li class="breadcrumb-item active" th:text="${book.title}">Title</li>
        </ol>
    </nav>

    <div class="row g-4">
        <div class="col-md-4">
            <img th:src="${book.imageUrl} ?: @{/images/placeholder.svg}" th:alt="${book.title}" class="img-fluid rounded shadow-sm w-100">
        </div>
        <div class="col-md-8">
            <h1 th:text="${book.title}">Title</h1>
            <p class="text-muted">by <span th:text="${book.author}">Author</span>
                <span th:if="${book.publicationYear}"> (<span th:text="${book.publicationYear}">Year</span>)</span>
            </p>
            <p><span class="badge text-bg-light border" th:text="${book.category}">Category</span></p>
            <p class="display-6 fw-bold text-success">
                $<span th:text="${#numbers.formatDecimal(book.price, 1, 2)}">0.00</span>
            </p>
            <p class="text-muted small">
                <span th:if="${book.stock > 0}" th:text="|In stock (${book.stock} available)|">In stock</span>
                <span th:if="${book.stock <= 0}">Out of stock</span>
            </p>
            <p th:if="${book.description}" th:text="${book.description}" class="mt-3">Description</p>
            <form class="d-flex align-items-center gap-2 mt-4" th:action="@{/cart/add}" method="post">
                <input type="hidden" name="bookId" th:value="${book.id}">
                <label for="qty" class="me-1">Qty:</label>
                <input id="qty" class="form-control" style="max-width: 80px" type="number" name="quantity" value="1" min="1" th:max="${book.stock}" th:disabled="${book.stock == 0}">
                <button type="submit" class="btn btn-dark" th:disabled="${book.stock == 0}">Add to cart</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
