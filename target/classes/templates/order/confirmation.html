<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order Confirmation')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container flex-grow-1 py-4" style="max-width: 900px">
    <div class="text-center mb-4">
        <div class="display-6">Thank you, <span th:text="${order.customerName}">Name</span>!</div>
        <p class="text-muted">Your order <strong>#<span th:text="${order.id}">1</span></strong> has been placed successfully.</p>
        <a th:href="@{/orders(email=${order.customerEmail})}" class="btn btn-outline-dark btn-sm">View order history</a>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between">
            <span>Order #<span th:text="${order.id}">1</span></span>
            <span class="badge text-bg-success" th:text="${order.status}">PLACED</span>
        </div>
        <div class="card-body">
            <p class="small text-muted mb-3" th:text="${#temporals.format(order.orderDate, 'MMM d, yyyy HH:mm')}">date</p>
            <table class="table">
                <thead>
                    <tr>
                        <th>Book</th>
                        <th class="text-center">Qty</th>
                        <th class="text-end">Price</th>
                        <th class="text-end">Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.book.title}">Title</td>
                        <td class="text-center" th:text="${item.quantity}">1</td>
                        <td class="text-end">$<span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">0.00</span></td>
                        <td class="text-end">$<span th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 1, 2)}">0.00</span></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="3" class="text-end">Total</th>
                        <th class="text-end">$<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span></th>
                    </tr>
                </tfoot>
            </table>
            <p class="small text-muted mb-0"><strong>Ship to:</strong> <span th:text="${order.customerAddress}">Address</span></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
