<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order History')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container flex-grow-1 py-4" style="max-width: 900px">
    <h1 class="h3 mb-4">Order History</h1>

    <form class="row g-2 mb-4" th:action="@{/orders}" method="get">
        <div class="col-md-6">
            <input type="email" class="form-control" name="email" placeholder="Enter your email address" th:value="${email}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-dark">Search</button>
        </div>
    </form>

    <div th:if="${orders == null}">
        <p class="text-muted">Enter your email above to see your orders.</p>
    </div>
    <div th:if="${orders != null and orders.isEmpty()}">
        <p class="text-muted">No orders found for that email.</p>
    </div>
    <div class="d-flex flex-column gap-3" th:if="${orders != null and !orders.isEmpty()}">
        <div class="card" th:each="order : ${orders}">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <strong>Order #<span th:text="${order.id}">1</span></strong>
                    <span class="text-muted small ms-2" th:text="${#temporals.format(order.orderDate, 'MMM d, yyyy HH:mm')}">date</span>
                </div>
                <div>
                    <span class="badge text-bg-success" th:text="${order.status}">PLACED</span>
                </div>
            </div>
            <div class="card-body">
                <table class="table table-sm mb-2">
                    <thead>
                        <tr>
                            <th>Book</th>
                            <th class="text-center">Qty</th>
                            <th class="text-end">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.book.title}">Title</td>
                            <td class="text-center" th:text="${item.quantity}">1</td>
                            <td class="text-end">$<span th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 1, 2)}">0.00</span></td>
                        </tr>
                    </tbody>
                </table>
                <div class="text-end fw-bold">Total: $<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span></div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
