<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Browse Books')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container flex-grow-1 py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 mb-0">Browse Books</h1>
        <span class="text-muted small" th:text="${books.totalElements} + ' book(s)'">0 books</span>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
        <a th:href="@{/(q=${q},page=0)}" class="btn btn-sm"
           th:classappend="${#strings.isEmpty(selectedCategory)} ? 'btn-dark' : 'btn-outline-secondary'">All</a>
        <a th:each="c : ${categories}" th:href="@{/(q=${q},category=${c},page=0)}" th:text="${c}"
           class="btn btn-sm"
           th:classappend="${selectedCategory == c} ? 'btn-dark' : 'btn-outline-secondary'">Category</a>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${!books.isEmpty()}">
        <div class="col" th:each="book : ${books.content}">
            <div class="card h-100 book-card shadow-sm">
                <div class="book-cover-wrapper">
                    <img th:src="${book.imageUrl} ?: @{/images/placeholder.svg}" th:alt="${book.title}" class="card-img-top book-cover" loading="lazy">
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fs-6" th:text="${book.title}">Title</h5>
                    <p class="text-muted small mb-1" th:text="${book.author}">Author</p>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge text-bg-light border" th:text="${book.category}">Category</span>
                        <span class="badge text-bg-warning" th:if="${book.stock == 0}">Out of stock</span>
                    </div>
                    <p class="mt-2 mb-0">
                        <span class="fw-bold text-success">$</span>
                        <span th:text="${#numbers.formatDecimal(book.price, 1, 2)}">0.00</span>
                    </p>
                    <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-outline-dark btn-sm mt-3 mt-auto">View details</a>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-5" th:if="${books.isEmpty()}">
        <h2 class="h5 text-muted">No books found</h2>
        <p class="text-muted">Try a different search term or category.</p>
        <a th:href="@{/}" class="btn btn-dark btn-sm">Clear filters</a>
    </div>

    <nav th:if="${books.totalPages > 1}" class="mt-4" aria-label="Pagination">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${books.first} ? 'disabled'">
                <a class="page-link" th:href="@{/(q=${q},category=${selectedCategory},page=${books.number - 1},size=${books.size})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, books.totalPages - 1)}"
                th:classappend="${i == books.number} ? 'active'">
                <a class="page-link" th:href="@{/(q=${q},category=${selectedCategory},page=${i},size=${books.size})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${books.last} ? 'disabled'">
                <a class="page-link" th:href="@{/(q=${q},category=${selectedCategory},page=${books.number + 1},size=${books.size})}">Next</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
